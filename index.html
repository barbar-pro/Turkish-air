<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Bakımdadır - Türk Hava Yolları</title>
    <!-- FontAwesome for TikTok Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1329;
        }

        /* Türk Havayolları temalı arka plan (Kırmızı/Bordo ağırlıklı uçuş/bulut atmosferi) */
        .maintenance-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.85), rgba(11, 19, 41, 0.95)),
                        url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            color: #ffffff;
        }

        /* Arka plan deseni için hafif overlay */
        .maintenance-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.5) 90%);
            pointer-events: none;
        }

        /* Üst kısım: Logo veya Başlık */
        .header-section {
            z-index: 2;
            text-align: center;
            margin-top: 20px;
        }

        .airline-logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e30a17; /* THY Kırmızısı */
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            background: #ffffff;
            padding: 8px 20px;
            border-radius: 4px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Orta Kısım: Bakım Mesajı */
        .content-box {
            z-index: 2;
            text-align: center;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .icon-plane {
            font-size: 50px;
            color: #e30a17;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }

        .content-box h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .content-box p {
            font-size: 16px;
            line-height: 1.6;
            color: #d1d5db;
        }

        /* Alt Kısım: TikTok ve aviationsteam */
        .footer-section {
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #ffffff;
            transition: opacity 0.3s ease;
        }

        .social-link:hover {
            opacity: 0.8;
        }

        .social-link i {
            font-size: 24px;
            color: #ffffff;
            background: #000000;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .brand-name {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <!-- Üst Kısım -->
        <div class="header-section">
            <div class="airline-logo">TÜRK HAVA YOLLARI</div>
        </div>

        <!-- Orta Kısım -->
        <div class="content-box">
            <div class="icon-plane">
                <i class="fa-solid fa-plane"></i>
            </div>
            <h1>SİTE BAKIMDADIR</h1>
            <p>Değerli yolcularımız ve ziyaretçilerimiz, daha iyi bir deneyim sunabilmek için web sitemizde planlı bakım çalışmaları gerçekleştiriyoruz. En kısa sürede yeniden hizmetinizde olacağız.</p>
        </div>

        <!-- Alt Kısım -->
        <div class="footer-section">
            <a href="#" class="social-link" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-tiktok"></i>
                <span class="brand-name">aviationsteam</span>
            </a>
        </div>
    </div>

</body>
</html>
